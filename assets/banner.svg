<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#E100FF"/>
    </linearGradient>
  </defs>
  <style>
    .nombre { font: 800 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #fff; animation: aparecer 1.2s ease-out both; }
    .sub { font: 600 26px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f3e6ff; animation: aparecer 1.2s ease-out 0.4s both; }
    @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <rect width="1200" height="220" fill="url(#fondo)"/>
  <path d="M0 175 C 300 215, 600 140, 900 170 S 1200 190, 1200 190 L 1200 220 L 0 220 Z" fill="#0d1117"/>
  <text x="600" y="95" text-anchor="middle" class="nombre">Ali David Morón</text>
  <text x="600" y="140" text-anchor="middle" class="sub">DJ Crossover | Ingeniería de Sonido</text>
</svg>
